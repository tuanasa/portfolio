<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact — Tuana Sandikci</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #000;
      font-family: Helvetica, Arial, sans-serif;
      min-height: 100vh;
      overflow: hidden;
      width: 100%;
      filter: blur(20px);
      opacity: 0;
      transition: filter 0.6s ease, opacity 0.6s ease;
    }

    body.visible {
      filter: blur(0px);
      opacity: 1;
    }

    .back {
      position: fixed;
      top: 1.5rem;
      left: 2rem;
      font-size: 0.75rem;
      font-weight: 900;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #f2f2f2;
      text-decoration: none;
      opacity: 0.4;
      transition: opacity 0.2s;
      z-index: 10;
    }

    .back:hover { opacity: 1; }

    .pop {
      position: fixed;
      color: #fff;
      font-weight: 900;
      text-decoration: none;
      letter-spacing: 0.05em;
      white-space: nowrap;
      pointer-events: auto;
      animation: popfade var(--dur) linear forwards;
      transform-origin: center;
    }

    @keyframes popfade {
      0%   { opacity: 0; transform: translate(-50%, -50%) scale(0.7); }
      15%  { opacity: 1; }
      85%  { opacity: 1; }
      100% { opacity: 0; transform: translate(-50%, -50%) scale(1.3); }
    }

    /* phone layout: lock the page so it can't scroll or bounce */
    @media (max-width: 600px) {
      html, body { overflow: hidden; overscroll-behavior: none; }
      body { position: fixed; inset: 0; }
      /* bigger tap area for back, above the popping words */
      .back { top: 0.5rem; left: 1rem; padding: 1rem; z-index: 1000; }
    }
  </style>
</head>
<body>

  <a class="back" href="index.html">Back</a>

  <script>
    const u = 'contact';
    const d = 'tuanasandikci' + '.' + 'com';
    const email = u + '@' + d;

    const items = [
      { text: 'instagram', href: 'https://instagram.com/tuanasa', target: '_blank' },
      { text: 'e-mail',    href: 'mailto:' + email,               target: '_self'  },
    ];

    const isPhone = window.matchMedia('(max-width: 600px)').matches;

    function spawn() {
      const item = items[Math.floor(Math.random() * items.length)];
      const el = document.createElement('a');
      el.className = 'pop';
      el.textContent = item.text;
      el.href = item.href;
      el.target = item.target;

      const size = Math.random() * 3 + 0.6;
      const dur  = Math.random() * 1.5 + 2;
      let x, y;
      do {
        x = Math.random() * 80 + 10;
        y = Math.random() * 80 + 10;
      } while (isPhone && x < 60 && y < 25); // keep the corner around the back button free

      const styles = [
        {},
        { fontStyle: 'italic' },
        { fontWeight: '900' },
        { fontFamily: 'Georgia, serif', fontStyle: 'italic' },
        { fontStyle: 'italic', fontWeight: '900' },
        { fontFamily: 'Georgia, serif', fontStyle: 'italic', fontWeight: '900' },
        { fontFamily: 'Georgia, serif' },
        { fontWeight: '200' },
        { textDecoration: 'underline' },
        { textDecoration: 'underline', fontStyle: 'italic' },
        { textDecoration: 'underline', fontWeight: '900' },
        { textDecoration: 'underline', fontFamily: 'Georgia, serif', fontStyle: 'italic' },
      ];
      const s = styles[Math.floor(Math.random() * styles.length)];
      Object.assign(el.style, s);

      el.style.setProperty('--dur', dur + 's');
      el.style.fontSize = size + 'rem';
      el.style.left = x + 'vw';
      el.style.top  = y + 'vh';

      document.body.appendChild(el);
      el.addEventListener('animationend', () => el.remove());

      const area = window.innerWidth * window.innerHeight;
      const base = isPhone ? 180 : Math.max(60, 1800000 / area);
      setTimeout(spawn, Math.random() * base + base * 0.4);
    }

    spawn();

    // back goes to the page you came from (falls back to the start page)
    const back = document.querySelector('.back');
    if (document.referrer) {
      const from = new URL(document.referrer);
      if (from.origin === location.origin && !from.pathname.endsWith('contact.html')) back.href = from.href;
    }

    // page transitions
    window.addEventListener('load', () => {
      setTimeout(() => document.body.classList.add('visible'), 50);
    });

    document.addEventListener('click', (e) => {
      const link = e.target.closest('a');
      if (!link) return;
      const href = link.getAttribute('href');
      if (!href || href === '#' || href.startsWith('mailto:') || link.target === '_blank') return;
      e.preventDefault();
      document.body.classList.remove('visible');
      setTimeout(() => { window.location.href = href; }, 600);
    });
  </script>
</body>
</html>
