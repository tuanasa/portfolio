<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tuana Sandikci</title>
  <script data-goatcounter="https://sandikci.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
  <link rel="icon" href="favicon/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon/favicon-16x16.png">
  <link rel="apple-touch-icon" href="favicon/apple-touch-icon.png">
  <link rel="manifest" href="favicon/site.webmanifest">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #000;
      color: #f2f2f2;
      font-family: Helvetica, Arial, sans-serif;
      padding: 0;
      min-height: 100vh;
    }

    /* fade lives on the content only, so the fixed bottom nav stays pinned to the screen (as on photoarchive) */
    .page-content {
      opacity: 0;
      transition: opacity 0.6s ease;
    }

    .page-content.visible {
      opacity: 1;
    }

    .page-content.visible .image-strip video {
      animation: videoblurin 6s ease forwards;
    }

    @keyframes videoblurin {
      0%   { filter: blur(30px); }
      100% { filter: blur(0px); }
    }

    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 100;
      display: flex;
      justify-content: center;
      gap: 0.6rem;
      padding: 2rem 2rem;
      mix-blend-mode: difference;
    }

    .bottom-nav a {
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      font-size: 0.85rem;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #fff;
      text-decoration: none;
      opacity: 0.4;
      transition: opacity 0.2s;
    }

    .bottom-nav a:hover { opacity: 1; }

    .image-strip {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding-bottom: 4rem;
    }

    .image-strip video {
      width: calc(90vw - 300px);
      max-width: 100%;
      display: block;
    }

    @media (max-width: 600px) {
      .image-strip video { width: 80vw; }
      /* no scrolling; video centered in the visible screen */
      html, body { overflow: hidden; overscroll-behavior: none; }
      body { position: fixed; inset: 0; }
      .image-strip { min-height: 0; height: 100vh; height: 100dvh; padding-bottom: 0; }
    }

    .image-strip video {
      cursor: none;
    }

    .video-cursor {
      position: fixed;
      pointer-events: none;
      z-index: 9999;
      display: none;
      transform: translate(-50%, -50%);
    }

    .video-cursor svg {
      width: 36px;
      height: 36px;
      fill: #fff;
      opacity: 0.9;
      filter: drop-shadow(0 0 4px rgba(0,0,0,0.6));
    }

    /* phone layout */
    @media (max-width: 600px) {
      .bottom-nav { gap: 0.5rem; padding: 1.25rem 0.75rem; flex-wrap: wrap; }
      .bottom-nav a { font-size: 0.6rem; letter-spacing: 0.06em; }
    }
  </style>
</head>
<body>

  <nav class="bottom-nav">
    <a href="about.html">Tuanasandikci</a>
    <a href="selectedwork.html">Selectedwork</a>
    <a href="photoarchive.html">Photoarchive</a>
    <a href="contact.html">Contact</a>
  </nav>

  <div class="page-content">
  <section id="work">
    <div class="image-strip">
      <video src="videos/LANDING%20PAGE/PORTFOLIO_LANDING_PAGE.mp4" autoplay muted loop playsinline></video>
    </div>
  </section>
  </div>


  <div class="video-cursor" id="videoCursor">
    <svg id="cursorIcon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <!-- pause icon by default (video is playing) -->
      <rect x="5" y="3" width="4" height="18" rx="1"/>
      <rect x="15" y="3" width="4" height="18" rx="1"/>
    </svg>
  </div>

  <script>
    const video = document.querySelector('.image-strip video');
    const cursor = document.getElementById('videoCursor');
    const cursorIcon = document.getElementById('cursorIcon');

    const pauseIcon = `<rect x="5" y="3" width="4" height="18" rx="1"/><rect x="15" y="3" width="4" height="18" rx="1"/>`;
    const playIcon = `<polygon points="5,3 19,12 5,21"/>`;

    function updateIcon() {
      cursorIcon.innerHTML = video.paused ? playIcon : pauseIcon;
    }

    document.addEventListener('mousemove', (e) => {
      cursor.style.left = e.clientX + 'px';
      cursor.style.top = e.clientY + 'px';
    });

    video.addEventListener('mouseenter', () => {
      cursor.style.display = 'block';
      updateIcon();
    });

    video.addEventListener('mouseleave', () => {
      cursor.style.display = 'none';
    });

    // decide play/pause from the state at the moment of pressing: if autoplay was blocked
    // and the browser's own play button starts the video, the first click must not pause it
    let pausedAtPress = video.paused;
    video.addEventListener('pointerdown', () => { pausedAtPress = video.paused; });

    video.addEventListener('click', (e) => {
      const wasPaused = e.detail === 0 ? video.paused : pausedAtPress; // detail 0: keyboard
      if (wasPaused) video.play().catch(() => {});
      else video.pause();
    });

    // keep the cursor icon in sync however the video gets started or stopped
    video.addEventListener('play', updateIcon);
    video.addEventListener('pause', updateIcon);

    // page transitions
    const pageContent = document.querySelector('.page-content');

    window.addEventListener('load', () => {
      setTimeout(() => pageContent.classList.add('visible'), 50);
    });

    document.addEventListener('click', (e) => {
      const link = e.target.closest('a');
      if (!link) return;
      const href = link.getAttribute('href');
      if (!href || href === '#' || href.startsWith('mailto:') || link.target === '_blank') return;
      e.preventDefault();
      pageContent.classList.remove('visible');
      setTimeout(() => { window.location.href = href; }, 600);
    });

    // live-reload: polls the server and refreshes when the file changes
    (() => {
      let lastModified = null;
      setInterval(async () => {
        try {
          const res = await fetch(location.href, { method: 'HEAD', cache: 'no-store' });
          const modified = res.headers.get('last-modified');
          if (lastModified && modified !== lastModified) location.reload();
          lastModified = modified;
        } catch (e) {}
      }, 1000);
    })();
  </script>
</body>
</html>
